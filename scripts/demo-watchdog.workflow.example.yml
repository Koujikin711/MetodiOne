name: Demo watchdog

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Health-check demo hosts
        env:
          # Restart requires Amvera CLI on the runner; CI only alerts on down hosts.
          WATCHDOG_RESTART: "0"
        run: |
          chmod +x scripts/demo_watchdog.sh
          scripts/demo_watchdog.sh
