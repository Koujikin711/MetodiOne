<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400..700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Syne:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>MetodiOne Studio — custom operational software</title>
    <meta
      name="description"
      content="MetodiOne Studio designs and ships individual applications of any complexity for businesses, teams and personal operations — CRM, ERP, messengers and automation with live demos."
    />
    <script>
      (function () {
        var t = localStorage.getItem("mo-theme");
        if (t !== "dark" && t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches) t = "dark";
        if (t === "dark") document.documentElement.dataset.theme = "dark";
        else document.documentElement.dataset.theme = "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
